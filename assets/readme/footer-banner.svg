<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="50%" stop-color="#111111" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5E6B8" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#E7C873" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Geist', 'Inter', sans-serif; font-weight: 700; }
    .mono { font-family: 'Geist Mono', monospace; }
  </style>

  <!-- Surface Frame -->
  <rect width="1000" height="120" rx="16" fill="url(#footerBg)" stroke="rgba(212,175,55,0.15)" stroke-width="1" />

  <!-- Left Side Small Validator Mesh Graphic -->
  <g transform="translate(60, 60)">
    <line x1="0" y1="-25" x2="-25" y2="20" stroke="#D4AF37" stroke-width="1" opacity="0.4" />
    <line x1="0" y1="-25" x2="25" y2="20" stroke="#D4AF37" stroke-width="1" opacity="0.4" />
    <line x1="-25" y1="20" x2="25" y2="20" stroke="#D4AF37" stroke-width="1" opacity="0.4" />

    <circle cx="0" cy="-25" r="4" fill="#D4AF37" />
    <circle cx="-25" cy="20" r="4" fill="#E7C873" />
    <circle cx="25" cy="20" r="4" fill="#22C55E" />

    <circle r="3" fill="#F5E6B8">
      <animateMotion path="M0,-25 L-25,20 L25,20 Z" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Center Text -->
  <text x="500" y="52" text-anchor="middle" fill="url(#goldText)" font-size="18" class="title" letter-spacing="-0.3">
    Built for the future of decentralized infrastructure.
  </text>
  <text x="500" y="78" text-anchor="middle" fill="#A1A1AA" font-size="11" class="mono" letter-spacing="1">
    YIELD-FORGE PROTOCOL • MODULAR INSTITUTIONAL CAPITAL EFFICIENCY
  </text>

  <!-- Right Side Brand Mark -->
  <g transform="translate(900, 60)">
    <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#161616" stroke="rgba(212,175,55,0.3)" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" fill="#D4AF37" font-size="11" class="mono" font-weight="700">YF</text>
  </g>
</svg>
