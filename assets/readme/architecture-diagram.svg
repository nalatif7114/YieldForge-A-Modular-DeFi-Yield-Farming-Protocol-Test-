<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161616" />
      <stop offset="100%" stop-color="#1F1F1F" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Geist', 'Inter', sans-serif; font-weight: 700; }
    .mono { font-family: 'Geist Mono', monospace; }
    
    .dashed-conduit {
      stroke-dasharray: 6 6;
      animation: conduitFlow 12s linear infinite;
    }
    @keyframes conduitFlow {
      from { stroke-dashoffset: 120; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background Surface -->
  <rect width="1000" height="240" rx="16" fill="url(#archBg)" stroke="rgba(212,175,55,0.12)" stroke-width="1" />

  <!-- Section Header -->
  <text x="40" y="40" fill="#E7C873" font-size="11" class="mono" letter-spacing="1.5">PROTOCOL ARCHITECTURE PIPELINE</text>

  <!-- Connecting Conduit Line -->
  <line x1="120" y1="130" x2="880" y2="130" stroke="#D4AF37" stroke-width="2" class="dashed-conduit" opacity="0.6" />

  <!-- Animated Gold Packets -->
  <circle r="5" fill="#F5E6B8">
    <animateMotion path="M 120 130 L 880 130" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle r="5" fill="#D4AF37">
    <animateMotion path="M 120 130 L 880 130" dur="6s" begin="2s" repeatCount="indefinite" />
  </circle>
  <circle r="5" fill="#22C55E">
    <animateMotion path="M 120 130 L 880 130" dur="6s" begin="4s" repeatCount="indefinite" />
  </circle>

  <!-- Node 1: Wallet -->
  <g transform="translate(60, 80)">
    <rect width="130" height="100" rx="12" fill="url(#nodeGrad)" stroke="rgba(212,175,55,0.2)" stroke-width="1" />
    <text x="65" y="36" text-anchor="middle" fill="#A1A1AA" font-size="10" class="mono">STAGE 01</text>
    <text x="65" y="58" text-anchor="middle" fill="#F4F4F4" font-size="14" class="title">Web3 Wallet</text>
    <text x="65" y="78" text-anchor="middle" fill="#22C55E" font-size="9" class="mono">Tx Ingestion</text>
  </g>

  <!-- Node 2: Consensus Engine -->
  <g transform="translate(250, 80)">
    <rect width="140" height="100" rx="12" fill="url(#nodeGrad)" stroke="#D4AF37" stroke-width="1.5" />
    <text x="70" y="36" text-anchor="middle" fill="#E7C873" font-size="10" class="mono">STAGE 02</text>
    <text x="70" y="58" text-anchor="middle" fill="#F5E6B8" font-size="14" class="title">Consensus Engine</text>
    <text x="70" y="78" text-anchor="middle" fill="#E7C873" font-size="9" class="mono">State Transition</text>
  </g>

  <!-- Node 3: Validator Network -->
  <g transform="translate(450, 80)">
    <rect width="140" height="100" rx="12" fill="url(#nodeGrad)" stroke="#D4AF37" stroke-width="1.5" />
    <text x="70" y="36" text-anchor="middle" fill="#E7C873" font-size="10" class="mono">STAGE 03</text>
    <text x="70" y="58" text-anchor="middle" fill="#F5E6B8" font-size="14" class="title">Validator Mesh</text>
    <text x="70" y="78" text-anchor="middle" fill="#22C55E" font-size="9" class="mono">BFT Consensus</text>
  </g>

  <!-- Node 4: State Root -->
  <g transform="translate(650, 80)">
    <rect width="130" height="100" rx="12" fill="url(#nodeGrad)" stroke="rgba(212,175,55,0.2)" stroke-width="1" />
    <text x="65" y="36" text-anchor="middle" fill="#A1A1AA" font-size="10" class="mono">STAGE 04</text>
    <text x="65" y="58" text-anchor="middle" fill="#F4F4F4" font-size="14" class="title">State Root</text>
    <text x="65" y="78" text-anchor="middle" fill="#E7C873" font-size="9" class="mono">Merkle Commit</text>
  </g>

  <!-- Node 5: Yield Distribution -->
  <g transform="translate(830, 80)">
    <rect width="130" height="100" rx="12" fill="url(#nodeGrad)" stroke="rgba(212,175,55,0.2)" stroke-width="1" />
    <text x="65" y="36" text-anchor="middle" fill="#A1A1AA" font-size="10" class="mono">STAGE 05</text>
    <text x="65" y="58" text-anchor="middle" fill="#F4F4F4" font-size="14" class="title">Yield Vaults</text>
    <text x="65" y="78" text-anchor="middle" fill="#22C55E" font-size="9" class="mono">Auto-Compound</text>
  </g>
</svg>
