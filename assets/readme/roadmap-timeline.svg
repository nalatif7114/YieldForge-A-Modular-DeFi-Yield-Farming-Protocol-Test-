<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%" height="100%">
  <defs>
    <linearGradient id="roadmapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Geist', 'Inter', sans-serif; font-weight: 700; }
    .mono { font-family: 'Geist Mono', monospace; }
  </style>

  <!-- Surface Background -->
  <rect width="1000" height="180" rx="16" fill="url(#roadmapBg)" stroke="rgba(212,175,55,0.12)" stroke-width="1" />

  <!-- Section Header -->
  <text x="40" y="36" fill="#E7C873" font-size="11" class="mono" letter-spacing="1.5">PROTOCOL DEVELOPMENT ROADMAP</text>

  <!-- Timeline Line -->
  <line x1="80" y1="100" x2="920" y2="100" stroke="rgba(212,175,55,0.2)" stroke-width="2" />
  <line x1="80" y1="100" x2="680" y2="100" stroke="#D4AF37" stroke-width="2" />

  <!-- Milestone 1: Phase 1 -->
  <g transform="translate(140, 100)">
    <circle cx="0" cy="0" r="8" fill="#22C55E" stroke="#161616" stroke-width="2" />
    <text x="0" y="-24" text-anchor="middle" fill="#22C55E" font-size="10" class="mono">COMPLETED</text>
    <text x="0" y="24" text-anchor="middle" fill="#F4F4F4" font-size="13" class="title">Phase 1: Smart Contracts</text>
    <text x="0" y="42" text-anchor="middle" fill="#A1A1AA" font-size="10" class="mono">Hardhat &amp; Solidity v2.29</text>
  </g>

  <!-- Milestone 2: Phase 2 -->
  <g transform="translate(380, 100)">
    <circle cx="0" cy="0" r="8" fill="#22C55E" stroke="#161616" stroke-width="2" />
    <text x="0" y="-24" text-anchor="middle" fill="#22C55E" font-size="10" class="mono">COMPLETED</text>
    <text x="0" y="24" text-anchor="middle" fill="#F4F4F4" font-size="13" class="title">Phase 2: Consensus Engine</text>
    <text x="0" y="42" text-anchor="middle" fill="#A1A1AA" font-size="10" class="mono">Observable State Machine</text>
  </g>

  <!-- Milestone 3: Phase 3 -->
  <g transform="translate(620, 100)">
    <circle cx="0" cy="0" r="8" fill="#D4AF37" stroke="#161616" stroke-width="2">
      <animate attributeName="r" values="8;11;8" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="-24" text-anchor="middle" fill="#E7C873" font-size="10" class="mono">COMPLETED</text>
    <text x="0" y="24" text-anchor="middle" fill="#F5E6B8" font-size="13" class="title">Phase 3: Institutional UI</text>
    <text x="0" y="42" text-anchor="middle" fill="#A1A1AA" font-size="10" class="mono">Champagne Gold Platform</text>
  </g>

  <!-- Milestone 4: Phase 4 -->
  <g transform="translate(840, 100)">
    <circle cx="0" cy="0" r="8" fill="#3F3F46" stroke="#161616" stroke-width="2" />
    <text x="0" y="-24" text-anchor="middle" fill="#A1A1AA" font-size="10" class="mono">UPCOMING</text>
    <text x="0" y="24" text-anchor="middle" fill="#A1A1AA" font-size="13" class="title">Phase 4: Multi-Chain Vaults</text>
    <text x="0" y="42" text-anchor="middle" fill="#A1A1AA" font-size="10" class="mono">Arbitrum &amp; Optimism</text>
  </g>
</svg>
