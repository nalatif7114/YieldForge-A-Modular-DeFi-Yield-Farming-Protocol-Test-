<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="50%" stop-color="#111111" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>

    <!-- Champagne Gold Text Gradient -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5E6B8" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#E7C873" />
    </linearGradient>

    <!-- Gold Line Gradient -->
    <linearGradient id="goldLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#E7C873" stop-opacity="0.1" />
    </linearGradient>

    <!-- Card Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Geist', 'Inter', sans-serif; font-weight: 800; }
    .mono-text { font-family: 'Geist Mono', 'Courier New', monospace; }
    
    /* Connection Line Dash Animation */
    .pulse-line {
      stroke-dasharray: 8 12;
      animation: dashMove 20s linear infinite;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }

    /* Node Breathing Animation */
    .node-pulse {
      animation: nodeGlow 4s ease-in-out infinite alternate;
    }
    @keyframes nodeGlow {
      0% { r: 6px; opacity: 0.6; }
      100% { r: 9px; opacity: 1; }
    }
  </style>

  <!-- Background Surface -->
  <rect width="1000" height="340" rx="16" fill="url(#bgGrad)" stroke="rgba(212,175,55,0.2)" stroke-width="1" />

  <!-- Ambient Gold Grid Lines -->
  <path d="M0 60 H1000 M0 120 H1000 M0 180 H1000 M0 240 H1000 M0 300 H1000" stroke="rgba(212,175,55,0.03)" stroke-width="1" />
  <path d="M200 0 V340 M400 0 V340 M600 0 V340 M800 0 V340" stroke="rgba(212,175,55,0.03)" stroke-width="1" />

  <!-- LEFT COLUMN: BRAND & HERO NARRATIVE -->
  <!-- Status Badge -->
  <rect x="48" y="44" width="280" height="28" rx="14" fill="#161616" stroke="rgba(212,175,55,0.2)" stroke-width="1" />
  <circle cx="64" cy="58" r="4" fill="#D4AF37">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="76" y="62" fill="#E7C873" font-size="10" class="mono-text" letter-spacing="1.5">INSTITUTIONAL YIELD INFRASTRUCTURE</text>

  <!-- Brand Title -->
  <text x="48" y="125" fill="#F4F4F4" font-size="44" class="title-text" letter-spacing="-1">YieldForge</text>

  <!-- Headline -->
  <text x="48" y="165" fill="url(#goldTextGrad)" font-size="28" class="title-text" letter-spacing="-0.5">The Protocol Never Sleeps.</text>

  <!-- Subtitle -->
  <text x="48" y="200" fill="#A1A1AA" font-size="13" class="title-text">A Modular DeFi Yield Farming Protocol with Real-Time</text>
  <text x="48" y="220" fill="#A1A1AA" font-size="13" class="title-text">Protocol Observability &amp; Automated Vault Execution</text>

  <!-- Metrics Chips -->
  <g transform="translate(48, 255)">
    <rect x="0" y="0" width="120" height="36" rx="8" fill="#161616" stroke="rgba(212,175,55,0.15)" stroke-width="1" />
    <text x="12" y="16" fill="#A1A1AA" font-size="9" class="mono-text">TOTAL TVL</text>
    <text x="12" y="28" fill="#F4F4F4" font-size="12" class="title-text" font-weight="700">$248.5M+</text>

    <rect x="130" y="0" width="120" height="36" rx="8" fill="#161616" stroke="rgba(212,175,55,0.15)" stroke-width="1" />
    <text x="142" y="16" fill="#A1A1AA" font-size="9" class="mono-text">NET APY</text>
    <text x="142" y="28" fill="#22C55E" font-size="12" class="title-text" font-weight="700">+14.80%</text>

    <rect x="260" y="0" width="130" height="36" rx="8" fill="#161616" stroke="rgba(212,175,55,0.15)" stroke-width="1" />
    <text x="272" y="16" fill="#A1A1AA" font-size="9" class="mono-text">VALIDATORS</text>
    <text x="272" y="28" fill="#E7C873" font-size="12" class="title-text" font-weight="700">8 / 8 Synced</text>
  </g>

  <!-- RIGHT COLUMN: ANIMATED TOPOLOGY GRAPH -->
  <g transform="translate(560, 20)">
    <!-- Connection Rays -->
    <line x1="200" y1="60" x2="100" y2="120" stroke="url(#goldLineGrad)" stroke-width="1.5" class="pulse-line" />
    <line x1="200" y1="60" x2="300" y2="120" stroke="url(#goldLineGrad)" stroke-width="1.5" class="pulse-line" />
    <line x1="100" y1="120" x2="60" y2="200" stroke="url(#goldLineGrad)" stroke-width="1.5" class="pulse-line" />
    <line x1="100" y1="120" x2="340" y2="200" stroke="url(#goldLineGrad)" stroke-width="1.5" class="pulse-line" />
    <line x1="300" y1="120" x2="60" y2="200" stroke="url(#goldLineGrad)" stroke-width="1.5" class="pulse-line" />
    <line x1="300" y1="120" x2="340" y2="200" stroke="url(#goldLineGrad)" stroke-width="1.5" class="pulse-line" />
    <line x1="60" y1="200" x2="200" y2="270" stroke="url(#goldLineGrad)" stroke-width="1.5" class="pulse-line" />
    <line x1="340" y1="200" x2="200" y2="270" stroke="url(#goldLineGrad)" stroke-width="1.5" class="pulse-line" />
    <line x1="60" y1="200" x2="340" y2="200" stroke="url(#goldLineGrad)" stroke-width="1.5" class="pulse-line" />

    <!-- Animated Packet Traveling Circles -->
    <circle r="4" fill="#F5E6B8">
      <animateMotion path="M200,60 L100,120 L60,200 L200,270" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="4" fill="#D4AF37">
      <animateMotion path="M200,60 L300,120 L340,200 L200,270" dur="4s" begin="1s" repeatCount="indefinite" />
    </circle>
    <circle r="4" fill="#22C55E">
      <animateMotion path="M60,200 L340,200" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Node Endpoints -->
    <!-- Node 1: Apex -->
    <g transform="translate(200, 60)">
      <rect x="-18" y="-12" width="36" height="24" rx="4" fill="#161616" stroke="#D4AF37" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#D4AF37" class="node-pulse" />
    </g>
    <!-- Node 2: NW -->
    <g transform="translate(100, 120)">
      <rect x="-18" y="-12" width="36" height="24" rx="4" fill="#161616" stroke="#E7C873" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#E7C873" />
    </g>
    <!-- Node 3: NE -->
    <g transform="translate(300, 120)">
      <rect x="-18" y="-12" width="36" height="24" rx="4" fill="#161616" stroke="#E7C873" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#E7C873" />
    </g>
    <!-- Node 4: West -->
    <g transform="translate(60, 200)">
      <rect x="-18" y="-12" width="36" height="24" rx="4" fill="#161616" stroke="#D4AF37" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#22C55E" />
    </g>
    <!-- Node 5: East -->
    <g transform="translate(340, 200)">
      <rect x="-18" y="-12" width="36" height="24" rx="4" fill="#161616" stroke="#D4AF37" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#22C55E" />
    </g>
    <!-- Node 6: Anchor -->
    <g transform="translate(200, 270)">
      <rect x="-18" y="-12" width="36" height="24" rx="4" fill="#161616" stroke="#D4AF37" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#D4AF37" class="node-pulse" />
    </g>
  </g>
</svg>
